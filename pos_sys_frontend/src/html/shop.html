<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop - Restaurant Management System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        body {
            background: #f5f5f5;
            padding: 30px;
        }
        .container {
            max-width: 1200px;
            margin: auto;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }
        .header h1 {
            color: #333;
        }
        .order-button {
            background: #ff7a00;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }
        .order-button:hover {
            background: #e66d00;
        }
        .category-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }
        .category-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
            text-decoration: none;
            color: #333;
            transition: 0.3s;
        }
        .category-card:hover {
            transform: translateY(-5px);
        }
        .category-card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }
        .category-info {
            padding: 15px;
            text-align: center;
        }
        .category-info h3 {
            margin-bottom: 5px;
        }
        .category-info p {
            color: #777;
        }
        #orderSection {
            display: none;
            background: white;
            margin-top: 40px;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }
        .order-title {
            margin-bottom: 20px;
            color: #333;
        }
        .customer-box {
            margin-bottom: 25px;
        }
        .customer-box label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }
        .customer-select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 15px;
        }
        .order-item {
            border-bottom: 1px solid #eee;
            padding: 15px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
        }
        .order-item-info {
            flex: 1;
        }
        .order-item-name {
            font-size: 17px;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .order-item-price {
            color: #777;
        }
        .quantity-box {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .quantity-btn {
            width: 32px;
            height: 32px;
            border: none;
            background: #eee;
            border-radius: 5px;
            cursor: pointer;
            font-size: 18px;
        }
        .quantity-btn:hover {
            background: #ddd;
        }
        .quantity {
            min-width: 25px;
            text-align: center;
            font-weight: bold;
        }
        .remove-btn {
            background: #dc3545;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 5px;
            cursor: pointer;
        }
        .remove-btn:hover {
            background: #bb2d3b;
        }
        .empty-order {
            text-align: center;
            padding: 30px;
            color: #777;
        }
        #summary {
            margin-top: 25px;
            border-top: 2px solid #eee;
            padding-top: 20px;
        }
        .summary-row {
            display: flex;
            justify-content: space-between;
            margin: 10px 0;
            font-size: 16px;
        }
        .total-row {
            font-size: 20px;
            font-weight: bold;
            margin-top: 15px;
        }
        .action-buttons {
            display: flex;
            gap: 10px;
            margin-top: 25px;
        }
        .checkout-btn {
            flex: 1;
            background: #28a745;
            color: white;
            border: none;
            padding: 13px;
            border-radius: 7px;
            cursor: pointer;
            font-size: 16px;
        }
        .clear-btn {
            background: #dc3545;
            color: white;
            border: none;
            padding: 13px 20px;
            border-radius: 7px;
            cursor: pointer;
            font-size: 16px;
        }
        .checkout-btn:hover {
            background: #218838;
        }
        .clear-btn:hover {
            background: #bb2d3b;
        }
        @media (max-width: 768px) {
            .category-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            .order-item {
                flex-direction: column;
                align-items: flex-start;
            }
        }
        @media (max-width: 500px) {
            body {
                padding: 15px;
            }
            .category-grid {
                grid-template-columns: 1fr;
            }
            .header {
                flex-direction: column;
                gap: 15px;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>🍽️ Restaurant Shop</h1>
        <button class="order-button" onclick="showOrder()">
            🛒 Your Order
            <span id="orderCount">0</span>
        </button>
    </div>
    <div class="category-grid">
        <a href="MainCourse.html" class="category-card">
            <img src="https://images.unsplash.com/photo-1504674900247-0877df9cc836"
                 alt="Main Course">
            <div class="category-info">
                <h3>Main Course</h3>
                <p>Delicious main dishes</p>
            </div>
        </a>
        <a href="Soup.html" class="category-card">
            <img src="https://images.unsplash.com/photo-1547592166-23ac45744acd"
                 alt="Soup">
            <div class="category-info">
                <h3>Soup</h3>
                <p>Fresh and hot soups</p>
            </div>
        </a>
        <a href="Salads.html" class="category-card">
            <img src="https://images.unsplash.com/photo-1512621776951-a57141f2eefd"
                 alt="Salads">
            <div class="category-info">
                <h3>Salads</h3>
                <p>Fresh healthy salads</p>
            </div>
        </a>
        <a href="Dessert.html" class="category-card">
            <img src="https://images.unsplash.com/photo-1551024506-0bccd828d307"
                 alt="Dessert">
            <div class="category-info">
                <h3>Dessert</h3>
                <p>Sweet desserts</p>
            </div>
        </a>
        <a href="Drink.html" class="category-card">
            <img src="https://images.unsplash.com/photo-1544145945-f90425340c7e"
                 alt="Drink">
            <div class="category-info">
                <h3>Drink</h3>
                <p>Cold and hot drinks</p>
            </div>
        </a>
        <a href="Cake.html" class="category-card">
            <img src="https://images.unsplash.com/photo-1578985545062-69928b1d9587"
                 alt="Cake">
            <div class="category-info">
                <h3>Cake</h3>
                <p>Fresh cakes and bakery</p>
            </div>
        </a>
    </div>
    <section id="orderSection">
        <h2 class="order-title"> 🛒 Your Order </h2>
        <div class="customer-box">
            <label for="customerSelect"> Customer </label>
            <select id="customerSelect" class="customer-select">
                <option value="">Select Customer </option>
            </select>
        </div>
        <div id="orderList"></div>
        <div id="summary"></div>
    </section>
</div>
<script>
    let order = JSON.parse(localStorage.getItem("order")) || [];
    let customers = JSON.parse(localStorage.getItem("customers")) || [];
    function saveOrder() {
        localStorage.setItem("order",JSON.stringify(order));
    }
    function updateOrderCount() {
        let totalItems = order.reduce(
            (total, item) => total + Number(item.quantity),
            0
        );
        document.getElementById("orderCount").textContent =
            totalItems;
    }


    // ================================
    // SHOW ORDER
    // ================================

    function showOrder() {

        // Reload latest order
        order =
            JSON.parse(localStorage.getItem("order")) || [];

        customers =
            JSON.parse(localStorage.getItem("customers")) || [];


        const section =
            document.getElementById("orderSection");


        section.style.display = "block";


        displayCustomers();

        displayOrder();

        updateOrderCount();


        section.scrollIntoView({
            behavior: "smooth"
        });

    }


    // ================================
    // DISPLAY CUSTOMERS
    // ================================

    function displayCustomers() {

        const select =
            document.getElementById("customerSelect");


        select.innerHTML =
            '<option value="">Select Customer</option>';


        if (customers.length === 0) {

            select.innerHTML +=
                '<option value="">No customers available</option>';

            return;
        }


        customers.forEach((customer, index) => {

            const option =
                document.createElement("option");


            option.value = index;


            option.textContent =
                customer.name ||
                customer.customerName ||
                "Customer " + (index + 1);


            select.appendChild(option);

        });

    }


    // ================================
    // DISPLAY ORDER
    // ================================

    function displayOrder() {

        const orderList =
            document.getElementById("orderList");


        const summary =
            document.getElementById("summary");


        orderList.innerHTML = "";


        if (order.length === 0) {

            orderList.innerHTML = `
                <div class="empty-order">
                    <h3>Your order is empty 🛒</h3>
                    <p>Please choose food from the menu.</p>
                </div>
            `;


            summary.innerHTML = "";

            return;
        }


        let totalItems = 0;

        let subtotal = 0;


        order.forEach((item, index) => {

            const price =
                Number(item.price) || 0;

            const quantity =
                Number(item.quantity) || 1;


            const itemTotal =
                price * quantity;


            totalItems += quantity;

            subtotal += itemTotal;


            orderList.innerHTML += `

                <div class="order-item">

                    <div class="order-item-info">

                        <div class="order-item-name">
                            ${item.name}
                        </div>
                        <div class="order-item-price">$${price.toFixed(2)}x${quantity}
                        </div>

                    </div>
                    <div class="quantity-box">
                        <button class="quantity-btn" onclick="changeQuantity(${index}, -1)">-</button>
                        <span class="quantity"> ${quantity}</span>
                        <button class="quantity-btn" onclick="changeQuantity(${index}, 1)">+</button>
                    </div>
                    <strong>$${itemTotal.toFixed(2)}</strong>
                    <button class="remove-btn" onclick="removeItem(${index})">Remove</button>
                </div>
            `;
        });
        summary.innerHTML = `
            <div class="summary-row">
                <span>Items</span>
                <span>${totalItems}</span>
            </div>
            <div class="summary-row">
                <span>Subtotal</span>
                <span>$${subtotal.toFixed(2)}</span>
            </div>
            <div class="summary-row total-row">
                <span>Total</span>
                <span>$${subtotal.toFixed(2)}</span>
            </div>
            <div class="action-buttons">
                <button class="checkout-btn" onclick="checkout()"> Checkout</button>
                <button onclick="clearCart()">Clear Cart</button>
            </div>
        `;
    }
    function changeQuantity(index, change) {
        if (!order[index]) {
            return;
        }
        order[index].quantity =
            Number(order[index].quantity) + change;
        if (order[index].quantity <= 0) {
            order.splice(index, 1);
        }
        saveOrder();
        displayOrder();
        updateOrderCount();
    }
    function removeItem(index) {
        if (!order[index]) {
            return;
        }
        const itemName =
            order[index].name;
        if (
            confirm("Remove " + itemName + " from your order?")
        ) {
            order.splice(index, 1);
            saveOrder();
            displayOrder();
            updateOrderCount();
        }
    }
    function clearCart() {
        if (order.length === 0) {
            return;
        }
        if (
            confirm("Are you sure you want to clear your order?")
        ) {
            order = [];
            saveOrder();
            displayOrder();
            updateOrderCount();
        }
    }
    function checkout() {
        if (order.length === 0) {
            alert("Your order is empty!");
            return;
        }
        const customerSelect =
            document.getElementById("customerSelect");
        const customerIndex =
            customerSelect.value;
        if (customerIndex === "") {
            alert("Please select a customer!");
            return;
        }
        customers =
            JSON.parse(
                localStorage.getItem("customers")
            ) || [];
        const customer =
            customers[customerIndex];
        if (!customer) {
            alert("Customer not found!");
           return;
        }
        let subtotal = 0;
        order.forEach(item => {
            subtotal +=
                Number(item.price) ;
                Number(item.quantity);
        });
        const newOrder = {
            id: Date.now(),
            customerId:
                customer.id ||
                customer.customerId ||
                customerIndex,
            customerName:
                customer.name ||
                customer.customerName ||
                "Unknown",
            products: order.map(item => ({
                name: item.name,
                price: Number(item.price),
                quantity: Number(item.quantity)
            })),
            totalPrice: subtotal,
            dateOrder:
                new Date().toLocaleString()
        };
        let orders =
            JSON.parse(
                localStorage.getItem("orders")
            ) || [];
        orders.push(newOrder);
        localStorage.setItem(
            "orders",
            JSON.stringify(orders)
        );
        // Clear current order
        order = [];
        saveOrder();
        displayOrder();
        updateOrderCount();
        alert(
            "Order completed successfully! 🎉\n\n" +
            "Customer: " +
            newOrder.customerName +
            "\nTotal: $" +
            subtotal.toFixed(2)
        );
    }
    window.addEventListener(
        "pageshow",
        function () {
            order =
                JSON.parse(
                    localStorage.getItem("order")
                ) || [];
            customers =
                JSON.parse(
                    localStorage.getItem("customers")
                ) || [];
            updateOrderCount();
      }
    );
</script>
</body>
</html>
