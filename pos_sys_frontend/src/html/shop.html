<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Restaurant Management System - Shop</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #eeeeee;
            color: #333;
        }

        /* =========================
           HEADER
        ========================= */

        .header {
            background: #4b3029;
            color: white;
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 24px;
        }

        .cart-button {
            background: white;
            color: #4b3029;
            border: none;
            padding: 10px 18px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        .cart-button:hover {
            background: #e9dfdc;
        }

        /* =========================
           CONTAINER
        ========================= */

        .container {
            width: 100%;
            min-height: 100vh;
            padding: 30px;
        }

        /* =========================
           TOP BAR
        ========================= */

        .top-bar {
            background: white;
            padding: 20px;
            margin-bottom: 25px;
            border-radius: 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .search-box {
            flex: 1;
            min-width: 250px;
        }

        .search-box input {
            width: 100%;
            height: 40px;
            border: 1px solid #bbb;
            padding: 8px 12px;
            outline: none;
            border-radius: 4px;
        }

        .search-box input:focus {
            border-color: #5a3b33;
        }

        .category-box select {
            width: 200px;
            height: 40px;
            border: 1px solid #bbb;
            padding: 5px 10px;
            outline: none;
            border-radius: 4px;
            background: white;
        }

        /* =========================
           TITLE
        ========================= */

        .section-title {
            margin-bottom: 20px;
        }

        .section-title h2 {
            color: #4b3029;
            font-size: 22px;
        }

        .section-title p {
            color: #777;
            margin-top: 5px;
        }

        /* =========================
           PRODUCT GRID
        ========================= */

        .product-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
        }

        .product-card {
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            transition: 0.2s;
        }

        .product-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.12);
        }

        .product-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
            background: #f3f3f3;
            display: block;
        }

        .no-image {
            width: 100%;
            height: 200px;
            background: #f3f3f3;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #999;
        }

        .product-info {
            padding: 15px;
        }

        .product-name {
            font-size: 18px;
            font-weight: bold;
            color: #4b3029;
            margin-bottom: 8px;
        }

        .product-category {
            display: inline-block;
            background: #e9dfdc;
            color: #4b3029;
            padding: 5px 8px;
            border-radius: 4px;
            font-size: 12px;
            margin-bottom: 10px;
        }

        .product-stock {
            font-size: 13px;
            color: #666;
            margin-bottom: 8px;
        }

        .product-price {
            font-size: 19px;
            font-weight: bold;
            color: #1479c9;
            margin-bottom: 12px;
        }

        .add-cart-btn {
            width: 100%;
            height: 38px;
            border: none;
            background: #5a3b33;
            color: white;
            cursor: pointer;
            border-radius: 4px;
            font-weight: bold;
        }

        .add-cart-btn:hover {
            background: #432b25;
        }

        .add-cart-btn:disabled {
            background: #999;
            cursor: not-allowed;
        }

        /* =========================
           NO PRODUCT
        ========================= */

        .no-products {
            background: white;
            padding: 50px;
            text-align: center;
            border-radius: 5px;
            color: #777;
            grid-column: 1 / -1;
        }

        .no-products h3 {
            color: #4b3029;
            margin-bottom: 10px;
        }

        /* =========================
           CART
        ========================= */

        .cart-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
        }

        .cart-overlay.active {
            display: block;
        }

        .cart {
            position: absolute;
            right: 0;
            top: 0;
            width: 420px;
            height: 100%;
            background: white;
            padding: 25px;
            overflow-y: auto;
        }

        .cart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #ddd;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        .cart-header h2 {
            color: #4b3029;
        }

        .close-cart {
            border: none;
            background: none;
            font-size: 25px;
            cursor: pointer;
            color: #555;
        }

        /* =========================
           CUSTOMER SELECT
        ========================= */

        .customer-section {
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid #ddd;
        }

        .customer-section label {
            display: block;
            font-weight: bold;
            font-size: 14px;
            color: #4b3029;
            margin-bottom: 8px;
        }

        .customer-section select {
            width: 100%;
            height: 40px;
            border: 1px solid #bbb;
            border-radius: 4px;
            padding: 5px 10px;
            outline: none;
            background: white;
        }

        .customer-section select:focus {
            border-color: #5a3b33;
        }

        .cart-item {
            display: flex;
            gap: 12px;
            border-bottom: 1px solid #ddd;
            padding: 12px 0;
        }

        .cart-item-image {
            width: 70px;
            height: 70px;
            object-fit: cover;
            background: #eee;
        }

        .cart-item-info {
            flex: 1;
        }

        .cart-item-name {
            font-weight: bold;
            margin-bottom: 5px;
        }

        .cart-item-price {
            color: #1479c9;
            font-weight: bold;
        }

        .quantity-controls {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 8px;
        }

        .quantity-controls button {
            width: 25px;
            height: 25px;
            border: none;
            background: #5a3b33;
            color: white;
            cursor: pointer;
            border-radius: 3px;
        }

        .quantity-controls span {
            min-width: 20px;
            text-align: center;
        }

        .remove-btn {
            background: #d9534f !important;
        }

        .cart-total {
            border-top: 2px solid #4b3029;
            margin-top: 20px;
            padding-top: 15px;
        }

        .total-row {
            display: flex;
            justify-content: space-between;
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .checkout-btn {
            width: 100%;
            height: 45px;
            border: none;
            background: #5a3b33;
            color: white;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
        }

        .checkout-btn:hover {
            background: #432b25;
        }

        .empty-cart {
            text-align: center;
            color: #777;
            padding: 40px 10px;
        }

        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 1100px) {
            .product-container {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        @media (max-width: 800px) {
            .product-container {
                grid-template-columns: repeat(2, 1fr);
            }

            .cart {
                width: 350px;
            }
        }

        @media (max-width: 550px) {
            .product-container {
                grid-template-columns: 1fr;
            }

            .container {
                padding: 15px;
            }

            .cart {
                width: 100%;
            }

            .category-box select {
                width: 100%;
            }

            .category-box {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<!-- =========================
     HEADER
========================= -->

<div class="header">

    <h1>Restaurant Shop</h1>

    <button class="cart-button" onclick="openCart()">
        🛒 Cart (<span id="cartCount">0</span>)
    </button>

</div>


<div class="container">

    <!-- =========================
         SEARCH & CATEGORY
    ========================= -->

    <div class="top-bar">

        <div class="search-box">

            <input
                type="text"
                id="searchInput"
                placeholder="Search product..."
                onkeyup="filterProducts()"
            >

        </div>

        <div class="category-box">

            <select
                id="categoryFilter"
                onchange="filterProducts()"
            >

                <option value="All">
                    All Categories
                </option>

            </select>

        </div>

    </div>


    <!-- =========================
         TITLE
    ========================= -->

    <div class="section-title">

        <h2>Our Menu</h2>

        <p>
            Choose your favorite food and add it to your cart.
        </p>

    </div>


    <!-- =========================
         PRODUCTS
    ========================= -->

    <div
        class="product-container"
        id="productContainer"
    >

    </div>

</div>


<!-- =========================
     CART
========================= -->

<div
    class="cart-overlay"
    id="cartOverlay"
    onclick="closeCartOutside(event)"
>

    <div
        class="cart"
        onclick="event.stopPropagation()"
    >

        <div class="cart-header">

            <h2>Your Cart</h2>

            <button
                class="close-cart"
                onclick="closeCart()"
            >
                ×
            </button>

        </div>


        <!-- =========================
             CUSTOMER
        ========================= -->

        <div class="customer-section">

            <label for="customerSelect">
                Select Customer
            </label>

            <select id="customerSelect">

                <option value="">
                    Select Customer
                </option>

            </select>

        </div>


        <!-- =========================
             CART ITEMS
        ========================= -->

        <div id="cartItems">

        </div>


        <!-- =========================
             TOTAL
        ========================= -->

        <div class="cart-total">

            <div class="total-row">

                <span>Total:</span>

                <span>
                    $<span id="cartTotal">0.00</span>
                </span>

            </div>

            <button
                class="checkout-btn"
                onclick="checkout()"
            >
                CHECKOUT
            </button>

        </div>

    </div>

</div>


<script>

/* =========================================
   GET PRODUCTS FROM INVENTORY
========================================= */

let products =
    JSON.parse(
        localStorage.getItem("products")
    ) || [];


/* =========================================
   GET CUSTOMERS
========================================= */

let customers =
    JSON.parse(
        localStorage.getItem("customers")
    ) || [];


/* =========================================
   CART
========================================= */

let cart =
    JSON.parse(
        localStorage.getItem("cart")
    ) || [];


/* =========================================
   DISPLAY PRODUCTS
========================================= */

function displayProducts(productList = products) {

    const container =
        document.getElementById(
            "productContainer"
        );

    container.innerHTML = "";


    const availableProducts =
        productList.filter(
            product =>
                product.status === "Available"
        );


    if (availableProducts.length === 0) {

        container.innerHTML = `

            <div class="no-products">

                <h3>No Products Found</h3>

                <p>
                    Please add products from Inventory.
                </p>

            </div>

        `;

        return;
    }


    availableProducts.forEach(
        product => {

            const card =
                document.createElement("div");

            card.className =
                "product-card";


            let imageHTML = "";


            if (product.image) {

                imageHTML = `

                    <img
                        class="product-image"
                        src="${product.image}"
                        alt="${product.productName}"
                    >

                `;

            } else {

                imageHTML = `

                    <div class="no-image">
                        No Image
                    </div>

                `;

            }


            card.innerHTML = `

                ${imageHTML}

                <div class="product-info">

                    <div class="product-name">
                        ${product.productName}
                    </div>

                    <span class="product-category">
                        ${product.category}
                    </span>

                    <div class="product-stock">

                        Stock:
                        ${product.stock}

                    </div>

                    <div class="product-price">

                        $${Number(product.price).toFixed(2)}

                    </div>

                    <button
                        class="add-cart-btn"
                        onclick="addToCart('${product.productId}')"
                        ${product.stock <= 0 ? "disabled" : ""}
                    >

                        ${
                            product.stock > 0
                            ? "ADD TO CART"
                            : "OUT OF STOCK"
                        }

                    </button>

                </div>

            `;


            container.appendChild(card);

        }
    );

}


/* =========================================
   LOAD CATEGORIES
========================================= */

function loadCategories() {

    const categoryFilter =
        document.getElementById(
            "categoryFilter"
        );


    categoryFilter.innerHTML =
        '<option value="All">All Categories</option>';


    const categories =
        [
            ...new Set(
                products.map(
                    product =>
                        product.category
                )
            )
        ];


    categories.forEach(
        category => {

            const option =
                document.createElement(
                    "option"
                );

            option.value =
                category;

            option.textContent =
                category;

            categoryFilter.appendChild(
                option
            );

        }
    );

}


/* =========================================
   LOAD CUSTOMERS
========================================= */

function loadCustomers() {

    /*
        Get latest customers
    */

    customers =
        JSON.parse(
            localStorage.getItem("customers")
        ) || [];


    const select =
        document.getElementById(
            "customerSelect"
        );


    select.innerHTML = `

        <option value="">
            Select Customer
        </option>

    `;


    customers.forEach(
        customer => {

            const option =
                document.createElement(
                    "option"
                );


            option.value =
                customer.id;


            option.textContent =
                customer.id +
                " - " +
                customer.name;


            select.appendChild(
                option
            );

        }
    );

}


/* =========================================
   FILTER PRODUCTS
========================================= */

function filterProducts() {

    const search =
        document.getElementById(
            "searchInput"
        )
        .value
        .toLowerCase();


    const category =
        document.getElementById(
            "categoryFilter"
        )
        .value;


    const filtered =
        products.filter(
            product => {

                const matchName =
                    product.productName
                        .toLowerCase()
                        .includes(search);


                const matchCategory =
                    category === "All" ||
                    product.category === category;


                return (
                    matchName &&
                    matchCategory
                );

            }
        );


    displayProducts(filtered);

}


/* =========================================
   ADD TO CART
========================================= */

function addToCart(productId) {

    products =
        JSON.parse(
            localStorage.getItem("products")
        ) || [];


    const product =
        products.find(
            p =>
                p.productId === productId
        );


    if (!product) {

        alert(
            "Product not found."
        );

        return;

    }


    if (product.stock <= 0) {

        alert(
            "This product is out of stock."
        );

        return;

    }


    const existingItem =
        cart.find(
            item =>
                item.productId === productId
        );


    if (existingItem) {

        if (
            existingItem.quantity <
            product.stock
        ) {

            existingItem.quantity++;

        } else {

            alert(
                "You cannot add more than available stock."
            );

            return;

        }

    } else {

        cart.push({

            productId:
                product.productId,

            productName:
                product.productName,

            price:
                Number(product.price),

            image:
                product.image,

            quantity: 1

        });

    }


    saveCart();

    updateCartCount();


    alert(
        product.productName +
        " added to cart!"
    );

}


/* =========================================
   SAVE CART
========================================= */

function saveCart() {

    localStorage.setItem(
        "cart",
        JSON.stringify(cart)
    );

}


/* =========================================
   UPDATE CART COUNT
========================================= */

function updateCartCount() {

    const count =
        cart.reduce(
            (total, item) =>
                total + item.quantity,
            0
        );


    document.getElementById(
        "cartCount"
    ).textContent = count;

}


/* =========================================
   OPEN CART
========================================= */

function openCart() {

    /*
        Refresh customers every time
        the cart is opened
    */

    loadCustomers();

    displayCart();


    document
        .getElementById("cartOverlay")
        .classList.add("active");

}


/* =========================================
   CLOSE CART
========================================= */

function closeCart() {

    document
        .getElementById("cartOverlay")
        .classList.remove("active");

}


/* =========================================
   CLOSE CART OUTSIDE
========================================= */

function closeCartOutside(event) {

    if (
        event.target.id ===
        "cartOverlay"
    ) {

        closeCart();

    }

}


/* =========================================
   DISPLAY CART
========================================= */

function displayCart() {

    const cartItems =
        document.getElementById(
            "cartItems"
        );


    cartItems.innerHTML = "";


    if (cart.length === 0) {

        cartItems.innerHTML = `

            <div class="empty-cart">

                <h3>Your cart is empty.</h3>

                <p>
                    Add some products from the menu.
                </p>

            </div>

        `;


        document.getElementById(
            "cartTotal"
        ).textContent = "0.00";


        return;

    }


    let total = 0;


    cart.forEach(
        (item, index) => {

            const itemTotal =
                item.price *
                item.quantity;


            total += itemTotal;


            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "cart-item";


            div.innerHTML = `

                ${
                    item.image
                    ?
                    `
                    <img
                        class="cart-item-image"
                        src="${item.image}"
                        alt="${item.productName}"
                    >
                    `
                    :
                    `
                    <div class="cart-item-image">
                    </div>
                    `
                }


                <div class="cart-item-info">

                    <div class="cart-item-name">

                        ${item.productName}

                    </div>


                    <div class="cart-item-price">

                        $${item.price.toFixed(2)}

                    </div>


                    <div class="quantity-controls">

                        <button
                            onclick="decreaseQuantity(${index})"
                        >
                            -
                        </button>


                        <span>

                            ${item.quantity}

                        </span>


                        <button
                            onclick="increaseQuantity(${index})"
                        >
                            +
                        </button>


                        <button
                            class="remove-btn"
                            onclick="removeFromCart(${index})"
                        >
                            ×
                        </button>

                    </div>

                </div>

            `;


            cartItems.appendChild(div);

        }
    );


    document.getElementById(
        "cartTotal"
    ).textContent =
        total.toFixed(2);

}


/* =========================================
   INCREASE QUANTITY
========================================= */

function increaseQuantity(index) {

    products =
        JSON.parse(
            localStorage.getItem("products")
        ) || [];


    const cartItem =
        cart[index];


    const product =
        products.find(
            p =>
                p.productId ===
                cartItem.productId
        );


    if (!product) {

        alert(
            "Product not found."
        );

        return;

    }


    if (
        cartItem.quantity <
        product.stock
    ) {

        cartItem.quantity++;

    } else {

        alert(
            "Not enough stock."
        );

        return;

    }


    saveCart();

    displayCart();

    updateCartCount();

}


/* =========================================
   DECREASE QUANTITY
========================================= */

function decreaseQuantity(index) {

    if (
        cart[index].quantity > 1
    ) {

        cart[index].quantity--;

    } else {

        cart.splice(index, 1);

    }


    saveCart();

    displayCart();

    updateCartCount();

}


/* =========================================
   REMOVE FROM CART
========================================= */

function removeFromCart(index) {

    cart.splice(index, 1);


    saveCart();

    displayCart();

    updateCartCount();

}


/* =========================================
   CHECKOUT
========================================= */

function checkout() {

    /* -------------------------
       CHECK CART
    ------------------------- */

    if (cart.length === 0) {

        alert(
            "Your cart is empty."
        );

        return;

    }


    /* -------------------------
       GET CUSTOMER
    ------------------------- */

    const customerId =
        document.getElementById(
            "customerSelect"
        ).value;


    if (!customerId) {

        alert(
            "Please select a customer before checkout."
        );

        return;

    }


    /* -------------------------
       CALCULATE TOTAL
    ------------------------- */

    let total = 0;


    cart.forEach(
        item => {

            total +=
                item.price *
                item.quantity;

        }
    );


    /* -------------------------
       CONFIRM CHECKOUT
    ------------------------- */

    const confirmCheckout =
        confirm(

            "Customer ID: " +
            customerId +

            "\nTotal: $" +
            total.toFixed(2) +

            "\n\nDo you want to checkout?"

        );


    if (!confirmCheckout) {

        return;

    }


    /* -------------------------
       GET LATEST PRODUCTS
    ------------------------- */

    products =
        JSON.parse(
            localStorage.getItem("products")
        ) || [];


    /* -------------------------
       UPDATE STOCK
    ------------------------- */

    cart.forEach(
        cartItem => {

            const product =
                products.find(
                    p =>
                        p.productId ===
                        cartItem.productId
                );


            if (product) {

                product.stock -=
                    cartItem.quantity;


                if (
                    product.stock <= 0
                ) {

                    product.stock = 0;

                    product.status =
                        "Unavailable";

                }

            }

        }
    );


    /* -------------------------
       SAVE PRODUCTS
    ------------------------- */

    localStorage.setItem(
        "products",
        JSON.stringify(products)
    );


    /* -------------------------
       CREATE ORDER
    ------------------------- */

    let orders =
        JSON.parse(
            localStorage.getItem("orders")
        ) || [];


    const today =
        new Date()
            .toISOString()
            .split("T")[0];


    const order = {

        id:
            "ORD-" +
            Date.now(),

        customerId:
            customerId,

        productsIds:
            cart.map(
                item =>
                    item.productId
            ),

        quantities:
            cart.map(
                item =>
                    item.quantity
            ),

        prices:
            cart.map(
                item =>
                    item.price
            ),

        totalPrice:
            total,

        dateOrder:
            today

    };


    orders.push(order);


    localStorage.setItem(
        "orders",
        JSON.stringify(orders)
    );


    /* -------------------------
       UPDATE CUSTOMER ORDERS
    ------------------------- */

    customers =
        JSON.parse(
            localStorage.getItem("customers")
        ) || [];


    const customerIndex =
        customers.findIndex(
            customer =>
                customer.id === customerId
        );


    if (customerIndex !== -1) {

        customers[customerIndex].totalOrders =
            Number(
                customers[customerIndex].totalOrders || 0
            ) + 1;


        localStorage.setItem(
            "customers",
            JSON.stringify(customers)
        );

    }


    /* -------------------------
       CLEAR CART
    ------------------------- */

    cart = [];

    saveCart();

    updateCartCount();

    displayCart();

    displayProducts();


    /* -------------------------
       SUCCESS
    ------------------------- */

    alert(

        "Checkout successful!" +

        "\n\nOrder ID: " +
        order.id +

        "\nCustomer ID: " +
        customerId +

        "\nTotal: $" +
        total.toFixed(2)

    );


    closeCart();

}


/* =========================================
   REFRESH PRODUCTS
========================================= */

function refreshProducts() {

    const newProducts =
        JSON.parse(
            localStorage.getItem("products")
        ) || [];


    if (
        JSON.stringify(newProducts) !==
        JSON.stringify(products)
    ) {

        products =
            newProducts;


        const categoryFilter =
            document.getElementById(
                "categoryFilter"
            );


        const currentCategory =
            categoryFilter.value;


        categoryFilter.innerHTML =
            '<option value="All">All Categories</option>';


        const categories =
            [
                ...new Set(
                    products.map(
                        product =>
                            product.category
                    )
                )
            ];


        categories.forEach(
            category => {

                const option =
                    document.createElement(
                        "option"
                    );


                option.value =
                    category;


                option.textContent =
                    category;


                categoryFilter.appendChild(
                    option
                );

            }
        );


        categoryFilter.value =
            categories.includes(
                currentCategory
            )
            ? currentCategory
            : "All";


        filterProducts();

    }


    /*
        Also refresh customers
        from Customer.html
    */

    const newCustomers =
        JSON.parse(
            localStorage.getItem("customers")
        ) || [];


    if (
        JSON.stringify(newCustomers) !==
        JSON.stringify(customers)
    ) {

        customers =
            newCustomers;
        loadCustomers();
    }
}
loadCategories();
loadCustomers();
displayProducts();
updateCartCount();
setInterval(
    refreshProducts,
    1000
);

</script>
