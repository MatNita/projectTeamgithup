<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orders Management</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <style>
    body { 
      background-color: #f8f9fa;
      font-family: Arial, sans-serif; 
      padding: 20px; 
    }
    .badge-pending { 
      background-color: #ffc107; 
      color: #000; 
    }
    .badge-preparing { 
      background-color: #0d6efd; 
      color: #fff; 
    }
    .badge-completed { 
      background-color: #198754; 
      color: #fff; 
    }
    .badge-cancelled { 
      background-color: #dc3545; 
      color: #fff; 
    }
    @media print {
      body * { 
        visibility: hidden; 
      }
      #printableReceipt, 
      #printableReceipt * { 
        visibility: visible; 
      }
      #printableReceipt { 
        position: absolute; 
        left: 0; 
        top: 0; 
        width: 100%; 
      }
    }
  </style>
</head>
<body>

<div class="container-fluid">
  <!-- Header & Search Bar -->
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="fw-bold">Orders Management</h2>
    <div class="d-flex gap-2">
      <input type="text" id="searchInput" class="form-control" placeholder="Search Order ID or Name..." onkeyup="filterOrders()">
      <select id="statusFilter" class="form-select" onchange="filterOrders()" style="width: 180px;">
        <option value="All">All Status</option>
        <option value="Pending">Pending</option>
        <option value="Preparing">Preparing</option>
        <option value="Completed">Completed</option>
        <option value="Cancelled">Cancelled</option>
      </select>
    </div>
  </div>

  <!-- Orders Table -->
  <div class="card shadow-sm border-0">
    <div class="card-body p-0">
      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
          <thead class="table-dark">
            <tr>
              <th>Order ID</th>
              <th>Customer</th>
              <th>Type</th>
              <th>Total Price</th>
              <th>Date</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="ordersTableBody">
            <!-- Orders dynamic load -->
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<!-- Order Details Modal -->
<div class="modal fade" id="orderModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-body p-4" id="printableReceipt">
        <div class="text-center mb-3">
          <h4 class="fw-bold mb-1">NitaNit Restaurant</h4>
          <p class="text-muted small mb-0">Daily Fresh Meals Delivered</p>
          <hr>
        </div>
        <div class="mb-3 small">
          <div><strong>Order ID:</strong> <span id="modalOrderId"></span></div>
          <div><strong>Customer:</strong> <span id="modalCustomerName"></span></div>
          <div><strong>Date:</strong> <span id="modalDate"></span></div>
          <div><strong>Type:</strong> <span id="modalType"></span></div>
        </div>
        <table class="table table-sm small mb-3">
          <thead>
            <tr>
              <th>Item</th>
              <th class="text-center">Qty</th>
              <th class="text-end">Price</th>
              <th class="text-end">Subtotal</th>
            </tr>
          </thead>
          <tbody id="modalItemsBody"></tbody>
        </table>
        <div class="d-flex justify-content-between fw-bold border-top pt-2">
          <span>Total:</span>
          <span id="modalTotalPrice">$0.00</span>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
        <button class="btn btn-primary" onclick="window.print()"><i class="bi bi-printer me-1"></i> Print Receipt</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
const API_URL = "http://127.0.0.1:8000/api/orders";
let currentUser = JSON.parse(localStorage.getItem('currentUser')) || {
    id: 1,
    name: 'Admin',
    role: 'Admin'
};
let orders = [];
document.addEventListener("DOMContentLoaded", function () {
    loadOrders();
});
async function loadOrders() {

    try {

        const response = await fetch(API_URL, {
            method: "GET",
            headers: {
                "Accept": "application/json"
            }
        });

        if (!response.ok) {
            throw new Error("Server error");
        }

        const result = await response.json();

        orders = result.data || [];

        filterOrders();

    } catch (error) {

        console.error("Load Orders Error:", error);

        const tbody =
            document.getElementById("ordersTableBody");

        tbody.innerHTML = `
            <tr>
                <td colspan="7"
                    class="text-center text-danger py-4">
                    មិនអាចភ្ជាប់ទៅកាន់ Server បានទេ!
                </td>
            </tr>
        `;
    }
}
function filterOrders() {

    const search =
        document.getElementById("searchInput")
        .value
        .toLowerCase();

    const selectedStatus =
        document.getElementById("statusFilter").value;
    let filteredOrders = [...orders];
    if (currentUser.role === "Customer") {
        filteredOrders = filteredOrders.filter(order => {
            return order.customer_id == currentUser.id;
        });
    }
    filteredOrders = filteredOrders.filter(order => {
        const orderNumber =
            String(order.order_number || "")
            .toLowerCase();

        const customerName =
            String(
                order.customer?.name ||
                "Walk-in Customer"
            ).toLowerCase();

        const orderStatus =
            String(order.status || "")
            .toLowerCase();


        const searchMatch =
            orderNumber.includes(search) ||
            customerName.includes(search);
        const statusMatch =
            selectedStatus === "All" ||
            orderStatus === selectedStatus.toLowerCase();
        return searchMatch && statusMatch;

    });


    renderOrdersTable(filteredOrders);
}
function renderOrdersTable(displayOrders) {
    const tbody =
        document.getElementById("ordersTableBody");

    tbody.innerHTML = "";
    if (displayOrders.length === 0) {

        tbody.innerHTML = `
            <tr>
                <td colspan="7"
                    class="text-center py-4 text-muted">
                    No orders found.
                </td>
            </tr>
        `;

        return;
    }


    displayOrders.forEach(order => {

        // Customer
        const customerName =
            order.customer?.name ||
            "Walk-in Customer";


        // Order Type
        const orderType =
            order.order_type ||
            "Takeaway";


        // Total
        const totalPrice =
            Number(order.total_amount || 0);


        // Date
        const orderDate =
            order.created_at
                ? new Date(order.created_at)
                    .toLocaleDateString()
                : "-";


        // Status
        const status =
            order.status || "pending";


        const statusText =
            status.charAt(0).toUpperCase() +
            status.slice(1);


        const badgeClass =
            `badge-${status}`;


        // Admin / Cashier
        const isStaff =
            currentUser.role === "Admin" ||
            currentUser.role === "Cashier";


        const tr =
            document.createElement("tr");


        tr.innerHTML = `

            <td>
                <strong>
                    ${order.order_number}
                </strong>
            </td>


            <td>
                ${customerName}
            </td>


            <td>
                <span class="badge bg-light text-dark border">
                    ${orderType}
                </span>
            </td>


            <td class="fw-bold">
                $${totalPrice.toFixed(2)}
            </td>


            <td>
                ${orderDate}
            </td>


            <td>
                <span class="badge ${badgeClass}">
                    ${statusText}
                </span>
            </td>


            <td>

                <button
                    class="btn btn-sm btn-outline-primary me-1"
                    onclick="viewOrderDetails(${order.id})">

                    <i class="bi bi-eye"></i>
                    View

                </button>


                ${
                    isStaff
                    ?
                    `

                    <select
                        class="form-select form-select-sm d-inline-block"
                        style="width: auto;"
                        onchange="updateStatus(${order.id}, this.value)">

                        <option value="Pending"
                            ${status === "pending" ? "selected" : ""}>
                            Pending
                        </option>

                        <option value="Preparing"
                            ${status === "preparing" ? "selected" : ""}>
                            Preparing
                        </option>

                        <option value="Completed"
                            ${status === "completed" ? "selected" : ""}>
                            Completed
                        </option>

                        <option value="Cancelled"
                            ${status === "cancelled" ? "selected" : ""}>
                            Cancelled
                        </option>

                    </select>

                    `
                    :
                    ""
                }

            </td>

        `;


        tbody.appendChild(tr);

    });
}


// =====================================
// UPDATE STATUS
// =====================================
async function updateStatus(orderId, newStatus) {

    const order =
        orders.find(order => order.id == orderId);


    if (!order) {

        alert("Order not found!");

        return;
    }


    // Convert Pending -> pending
    newStatus =
        newStatus.toLowerCase();


    try {

        const response = await fetch(
            API_URL + "/" + orderId,
            {
                method: "PUT",

                headers: {
                    "Content-Type": "application/json",
                    "Accept": "application/json"
                },

                body: JSON.stringify({

                    customer_id:
                        order.customer_id,

                    order_type:
                        order.order_type,

                    total_amount:
                        order.total_amount,

                    status:
                        newStatus

                })
            }
        );


        const result =
            await response.json();


        if (!response.ok) {

            console.error(result);

            alert(
                result.message ||
                "មានបញ្ហាក្នុងការកែប្រែ Status!"
            );

            return;
        }


        alert("កែប្រែ Status ជោគជ័យ!");


        // Load again from database
        loadOrders();

    } catch (error) {

        console.error(
            "Update Status Error:",
            error
        );

        alert(
            "មិនអាចភ្ជាប់ទៅកាន់ Server បានទេ!"
        );
    }
}


// =====================================
// VIEW ORDER DETAILS
// =====================================
async function viewOrderDetails(orderId) {

    try {

        const response =
            await fetch(
                API_URL + "/" + orderId,
                {
                    method: "GET",

                    headers: {
                        "Accept": "application/json"
                    }
                }
            );


        if (!response.ok) {

            throw new Error(
                "Order not found"
            );
        }


        const result =
            await response.json();


        const order =
            result.data;


        // Order ID
        document.getElementById(
            "modalOrderId"
        ).innerText =
            order.order_number;


        // Customer
        document.getElementById(
            "modalCustomerName"
        ).innerText =
            order.customer?.name ||
            "Walk-in Customer";


        // Date
        document.getElementById(
            "modalDate"
        ).innerText =
            order.created_at
                ? new Date(
                    order.created_at
                  ).toLocaleString()
                : "-";


        // Type
        document.getElementById(
            "modalType"
        ).innerText =
            order.order_type ||
            "Takeaway";


        // Total
        document.getElementById(
            "modalTotalPrice"
        ).innerText =
            "$" +
            Number(
                order.total_amount || 0
            ).toFixed(2);


        // =================================
        // ITEMS
        // =================================
        const itemsBody =
            document.getElementById(
                "modalItemsBody"
            );


        itemsBody.innerHTML = "";


        /*
         * ពេលនេះ Backend orders table
         * មិនទាន់មាន order_items table
         *
         * ដូច្នេះបង្ហាញ No items found
         */

        itemsBody.innerHTML = `
            <tr>
                <td colspan="4"
                    class="text-center text-muted">
                    No items found.
                </td>
            </tr>
        `;


        // =================================
        // OPEN MODAL
        // =================================
        const modalElement =
            document.getElementById(
                "orderModal"
            );


        const modal =
            new bootstrap.Modal(
                modalElement
            );


        modal.show();


    } catch (error) {

        console.error(
            "View Order Error:",
            error
        );

        alert(
            "មិនអាចទាញយកព័ត៌មាន Order បានទេ!"
        );
    }
}
</script>

</body>
</html>
