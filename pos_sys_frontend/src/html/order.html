<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orders Management</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <style>
    body { 
      background-color: #f8f9fa;
      font-family: Arial, sans-serif; 
      padding: 20px; 
    }
    .badge-pending { 
      background-color: #ffc107; 
      color: #000; 
    }
    .badge-preparing { 
      background-color: #0d6efd; 
      color: #fff; 
    }
    .badge-completed { 
      background-color: #198754; 
      color: #fff; 
    }
    .badge-cancelled { 
      background-color: #dc3545; 
      color: #fff; 
    }
    @media print {
      body * { 
        visibility: hidden; 
      }
      #printableReceipt, 
      #printableReceipt * { 
        visibility: visible; 
      }
      #printableReceipt { 
        position: absolute; 
        left: 0; 
        top: 0; 
        width: 100%; 
      }
    }
  </style>
</head>
<body>

<div class="container-fluid">
  <!-- Header & Search Bar -->
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="fw-bold">Orders Management</h2>
    <div class="d-flex gap-2">
      <input type="text" id="searchInput" class="form-control" placeholder="Search Order ID or Name..." onkeyup="filterOrders()">
      <select id="statusFilter" class="form-select" onchange="filterOrders()" style="width: 180px;">
        <option value="All">All Status</option>
        <option value="Pending">Pending</option>
        <option value="Preparing">Preparing</option>
        <option value="Completed">Completed</option>
        <option value="Cancelled">Cancelled</option>
      </select>
    </div>
  </div>

  <!-- Orders Table -->
  <div class="card shadow-sm border-0">
    <div class="card-body p-0">
      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
          <thead class="table-dark">
            <tr>
              <th>Order ID</th>
              <th>Customer</th>
              <th>Type</th>
              <th>Total Price</th>
              <th>Date</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="ordersTableBody">
            <!-- Orders dynamic load -->
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<!-- Order Details Modal -->
<div class="modal fade" id="orderModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-body p-4" id="printableReceipt">
        <div class="text-center mb-3">
          <h4 class="fw-bold mb-1">NitaNit Restaurant</h4>
          <p class="text-muted small mb-0">Daily Fresh Meals Delivered</p>
          <hr>
        </div>
        <div class="mb-3 small">
          <div><strong>Order ID:</strong> <span id="modalOrderId"></span></div>
          <div><strong>Customer:</strong> <span id="modalCustomerName"></span></div>
          <div><strong>Date:</strong> <span id="modalDate"></span></div>
          <div><strong>Type:</strong> <span id="modalType"></span></div>
        </div>
        <table class="table table-sm small mb-3">
          <thead>
            <tr>
              <th>Item</th>
              <th class="text-center">Qty</th>
              <th class="text-end">Price</th>
              <th class="text-end">Subtotal</th>
            </tr>
          </thead>
          <tbody id="modalItemsBody"></tbody>
        </table>
        <div class="d-flex justify-content-between fw-bold border-top pt-2">
          <span>Total:</span>
          <span id="modalTotalPrice">$0.00</span>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
        <button class="btn btn-primary" onclick="window.print()"><i class="bi bi-printer me-1"></i> Print Receipt</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
  let currentUser = JSON.parse(localStorage.getItem('currentUser')) || { name: 'Admin', role: 'Admin' };
  let orders = JSON.parse(localStorage.getItem('orders')) || [];

  document.addEventListener("DOMContentLoaded", function () {
    displayOrders();
});

function displayOrders() {
    let orders = JSON.parse(localStorage.getItem("orders")) || [];
    let tbody = document.querySelector("table tbody"); // ឬ ID នៃ Table របស់អ្នក
    
    if (!tbody) return;
    tbody.innerHTML = "";

    if (orders.length === 0) {
        tbody.innerHTML = `<tr><td colspan="7" class="text-center">No orders found.</td></tr>`;
        return;
    }

    orders.forEach(order => {
        tbody.innerHTML += `
            <tr>
                <td>${order.id}</td>
                <td>${order.customerName}</td>
                <td>Takeaway</td> <!-- ឬ Order Type -->
                <td>$${Number(order.totalPrice).toFixed(2)}</td>
                <td>${order.dateOrder}</td>
                <td><span class="badge bg-warning">${order.status || 'Pending'}</span></td>
                <td>
                    <button class="btn btn-sm btn-info" onclick="viewDetails('${order.id}')">View</button>
                </td>
            </tr>
        `;
    });
}
  function filterOrders() {
    const search = document.getElementById('searchInput').value.toLowerCase();
    const status = document.getElementById('statusFilter').value;

    let filtered = orders;

    // Filter តាម Role
    if (currentUser.role === 'Customer') {
      filtered = orders.filter(o => o.customerId === currentUser.id || o.customerName === currentUser.name);
    }

    // Filter តាម Search & Status
    filtered = filtered.filter(order => {
      const matchesSearch = order.orderId.toLowerCase().includes(search) || 
                            order.customerName.toLowerCase().includes(search);
      const matchesStatus = (status === 'All') || (order.status === status);
      return matchesSearch && matchesStatus;
    });

    renderOrdersTable(filtered);
  }

  function renderOrdersTable(displayOrders) {
    const tbody = document.getElementById('ordersTableBody');
    tbody.innerHTML = '';

    if (displayOrders.length === 0) {
      tbody.innerHTML = `<tr><td colspan="7" class="text-center py-4 text-muted">No orders found.</td></tr>`;
      return;
    }

    displayOrders.forEach(order => {
      const badgeClass = `badge-${order.status.toLowerCase()}`;
      const isStaff = currentUser.role === 'Admin' || currentUser.role === 'Cashier';

      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td><strong>${order.orderId}</strong></td>
        <td>${order.customerName}</td>
        <td><span class="badge bg-light text-dark border">${order.orderType}</span></td>
        <td class="fw-bold">$${parseFloat(order.totalPrice).toFixed(2)}</td>
        <td>${order.date}</td>
        <td><span class="badge ${badgeClass}">${order.status}</span></td>
        <td>
          <button class="btn btn-sm btn-outline-primary me-1" onclick="viewOrderDetails('${order.orderId}')"><i class="bi bi-eye"></i> View</button>
          ${isStaff ? `
            <select class="form-select form-select-sm d-inline-block" style="width: auto;" onchange="updateStatus('${order.orderId}', this.value)">
              <option value="Pending" ${order.status==='Pending'?'selected':''}>Pending</option>
              <option value="Preparing" ${order.status==='Preparing'?'selected':''}>Preparing</option>
              <option value="Completed" ${order.status==='Completed'?'selected':''}>Completed</option>
              <option value="Cancelled" ${order.status==='Cancelled'?'selected':''}>Cancelled</option>
            </select>
          ` : ''}
        </td>
      `;
      tbody.appendChild(tr);
    });
  }

  function updateStatus(orderId, newStatus) {
    const order = orders.find(o => o.orderId === orderId);
    if (order) {
      order.status = newStatus;
      localStorage.setItem('orders', JSON.stringify(orders));
      filterOrders();
    }
  }

  function viewOrderDetails(orderId) {
    const order = orders.find(o => o.orderId === orderId);
    if (!order) return;

    document.getElementById('modalOrderId').innerText = order.orderId;
    document.getElementById('modalCustomerName').innerText = order.customerName;
    document.getElementById('modalDate').innerText = order.date;
    document.getElementById('modalType').innerText = order.orderType;
    document.getElementById('modalTotalPrice').innerText = `$${parseFloat(order.totalPrice).toFixed(2)}`;

    const itemsBody = document.getElementById('modalItemsBody');
    itemsBody.innerHTML = '';
    order.items.forEach(item => {
      itemsBody.innerHTML += `
        <tr>
          <td>${item.name}</td>
          <td class="text-center">${item.qty}</td>
          <td class="text-end">$${parseFloat(item.price).toFixed(2)}</td>
          <td class="text-end">$${(item.qty * item.price).toFixed(2)}</td>
        </tr>
      `;
    });

    new bootstrap.Modal(document.getElementById('orderModal')).show();
  }
</script>
</body>
</html>
