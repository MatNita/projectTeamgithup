<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Choose Role - InventoryPro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body { 
            background: rgb(117, 103, 106); 
            min-height: 100vh; display: flex; 
            justify-content: center; 
            align-items: center; 
            padding: 20px; 
        }
        .role-card { 
            width: 100%; 
            max-width: 1000px; 
            background: white; 
            border-radius: 25px; 
            padding: 50px; 
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15); 
        }
        .role-title { 
            text-align: center; 
            font-size: 32px; 
            font-weight: 700; 
            margin-bottom: 10px; 
        }
        .role-subtitle { 
            text-align: center; 
            color: #777; margin-bottom: 40px; 
        }
        .role-box { 
            border: 2px solid #eeeeee; 
            border-radius: 20px; padding: 30px 20px; 
            text-align: center; 
            height: 100%; 
            transition: 0.3s; 
        }
        .role-box:hover { 
            transform: translateY(-5px); 
            border-color: #ff69b4; 
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.10); 
        }
        .role-icon { 
            font-size: 50px; 
            margin-bottom: 15px; 
        }
        .role-name { 
            font-size: 24px; 
            font-weight: 600; 
            margin-bottom: 10px; 
        }
        .role-description { 
            color: #777; 
            min-height: 50px; 
            margin-bottom: 25px; 
        }
        .choose-btn { 
            width: 100%; 
            border: none; 
            padding: 12px; 
            border-radius: 10px; 
            background: #ff69b4; 
            color: white; 
            font-weight: 600; 
            cursor: pointer; 
            transition: 0.3s; 
        }
        .choose-btn:hover { 
            background: #ff4fa3; 
        }
        .logout-btn { 
            display: block; 
            margin: 30px auto 0; 
            border: none; 
            background: transparent; 
            color: #777; 
            text-decoration: underline; 
            cursor: pointer; 
        }
        .logout-btn:hover { 
            color: red; 
        }
    </style>
</head>
<body>

<div class="role-card">
    <h1 class="role-title">Choose Your Role</h1>
    <p class="role-subtitle">Select the role you want to use</p>

    <div class="row g-4">
        <!-- ADMIN -->
        <div class="col-md-4">
            <div class="role-box">
                <div class="role-icon"><i class="bi bi-person-gear"></i></div>
                <div class="role-name">Admin</div>
                <p class="role-description">Access Dashboard, Inventory and Customer.</p>
                <button type="button" class="choose-btn" onclick="chooseRole('Admin')">Choose Admin</button>
            </div>
        </div>

        <!-- CASHIER -->
        <div class="col-md-4">
            <div class="role-box">
                <div class="role-icon"><i class="bi bi-person-badge"></i></div>
                <div class="role-name">Cashier</div>
                <p class="role-description">Access Dashboard, Inventory, Customer and Shop.</p>
                <button type="button" class="choose-btn" onclick="chooseRole('Cashier')">Choose Cashier</button>
            </div>
        </div>

        <!-- USER -->
        <div class="col-md-4">
            <div class="role-box">
                <div class="role-icon"><i class="bi bi-person"></i></div>
                <div class="role-name">User</div>
                <p class="role-description">Access Shop only to view and buy products.</p>
                <button type="button" class="choose-btn" onclick="chooseRole('User')">Choose User</button>
            </div>
        </div>
    </div>

    <button type="button" class="logout-btn" onclick="logout()">Logout</button>
</div>

<script>
    function checkLogin() {
        let currentUser = JSON.parse(localStorage.getItem("currentUser"));
        if (!currentUser) {
            alert("Please login first!");
            window.location.href = "login.html";
        }
    }

    function chooseRole(role) {
        let currentUser = JSON.parse(localStorage.getItem("currentUser"));
        if (!currentUser) {
            alert("Please login first!");
            window.location.href = "login.html";
            return;
        }

        if (role === "Admin") {
            let password = prompt("Enter Admin password:");
            if (password === "admin123") {
                currentUser.role = "Admin";
                currentUser.selectedRole = "Admin";
                localStorage.setItem("currentUser", JSON.stringify(currentUser));
                window.location.href = "index.html"; // ឬ index.html តាមតម្រូវការ
            } else {
                alert("Incorrect Admin password!");
            }
        } 
        else if (role === "Cashier") {
            let password = prompt("Enter Cashier password:");
            if (password === "cashier123") {
                currentUser.role = "Cashier";
                currentUser.selectedRole = "Cashier";
                localStorage.setItem("currentUser", JSON.stringify(currentUser));
                window.location.href = "index.html"; // ឬ index.html តាមតម្រូវការ
            } else {
                alert("Incorrect Cashier password!");
            }
        } 
        else if (role === "User") {
            currentUser.role = "User";
            currentUser.selectedRole = "User";
            localStorage.setItem("currentUser", JSON.stringify(currentUser));

            // Sync ទិន្នន័យ User នេះចូលទៅក្នុងបញ្ជី customers សម្រាប់ឱ្យ Admin/Cashier មើលឃើញក្នុង Dropdown Select
            syncUserToCustomers(currentUser);

            window.location.href = "user.html";
        }
    }

    function syncUserToCustomers(user) {
        let customers = JSON.parse(localStorage.getItem("customers")) || [];
        let exists = customers.some(c => String(c.id) === String(user.id));
        
        if (!exists) {
            customers.push({
                id: user.id || "USR-" + Date.now(),
                name: user.name || "Customer",
                email: user.email || ""
            });
            localStorage.setItem("customers", JSON.stringify(customers));
        }
    }

    function logout() {
        localStorage.removeItem("currentUser");
        window.location.href = "login.html";
    }

    checkLogin();
</script>
</body>
</html>
