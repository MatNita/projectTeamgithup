<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Login - InventoryPro</title>


<!-- Bootstrap CSS -->

<link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">


<!-- Bootstrap Icons -->

<link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">


<!-- Login CSS -->

<link
    rel="stylesheet"
    href="../css/login.css">
</head>
<body>
<div class="login-card">


    <!-- Title -->

    <h1 class="login-title">
        Sign in to your account
    </h1>


    <p class="login-subtitle">
        Enter your credentials to continue
    </p>



    <!-- Login Form -->

    <form onsubmit="loginPage(event)">


        <!-- Email -->

        <label class="form-label">
            Email Address
        </label>


        <div class="input-group mb-3">

            <span class="input-group-text">

                <i class="bi bi-envelope"></i>

            </span>


            <input
                type="email"
                id="email"
                class="form-control"
                placeholder="you@example.com"
                required
            >

        </div>



        <!-- Password -->

        <label class="form-label">
            Password
        </label>


        <div class="input-group">

            <span class="input-group-text">

                <i class="bi bi-lock"></i>

            </span>


            <input
                type="password"
                id="password"
                class="form-control password-input"
                placeholder="Enter your password"
                required
            >


            <button
                type="button"
                class="btn show-password"
                onclick="showPassword()"
            >

                <i
                    class="bi bi-eye"
                    id="eyeIcon">
                </i>

            </button>

        </div>



        <!-- Remember / Forgot -->

        <div class="remember-area">


            <div class="form-check">

                <input
                    class="form-check-input"
                    type="checkbox"
                    id="remember"
                    checked
                >


                <label
                    class="form-check-label"
                    for="remember"
                >

                    Remember me

                </label>

            </div>


            <a
                href="#"
                class="forgot-password"
                onclick="forgotPassword(event)"
            >

                Forgot password?

            </a>

        </div>



        <!-- Sign In -->

        <button
            type="submit"
            class="btn-login"
        >

            Sign In

        </button>



        <!-- Divider -->

        <div class="divider">

            <span>
                or
            </span>

        </div>



        <!-- Register -->

        <div class="create-account">

            Don't have an account?

            <a href="register.html">
                Create account
            </a>

        </div>


    </form>

</div>



<script>


    // ==================================================
    // CREATE DEFAULT ADMIN
    // ==================================================

    function createDefaultAdmin() {


        let users =
            JSON.parse(
                localStorage.getItem("users")
            ) || [];


        // Check if Admin exists

        let adminExists =
            users.some(function (user) {

                return user.role === "Admin";

            });


        // Create Admin

        if (!adminExists) {


            let admin = {

                id: "USR-ADMIN-001",

                name: "Restaurant Admin",

                email: "admin@gmail.com",

                password: "123456",

                role: "Admin",

                status: "Active"

            };


            users.push(admin);


            localStorage.setItem(
                "users",
                JSON.stringify(users)
            );

        }

    }



    // ==================================================
    // LOGIN
    // ==================================================

    function loginPage(event) {


        // Prevent page refresh

        event.preventDefault();


        // Get email

        let email =
            document
                .getElementById("email")
                .value
                .trim();


        // Get password

        let password =
            document
                .getElementById("password")
                .value;


        // Get users

        let users =
            JSON.parse(
                localStorage.getItem("users")
            ) || [];


        // Find matching user

        let user =
            users.find(function (u) {

                return (
                    u.email === email &&
                    u.password === password
                );

            });



        // ==================================================
        // INVALID LOGIN
        // ==================================================

        if (!user) {

            alert(
                "Invalid email or password!"
            );

            return;

        }



        // ==================================================
        // CHECK STATUS
        // ==================================================

        if (user.status !== "Active") {

            alert(
                "Your account is inactive!"
            );

            return;

        }



        // ==================================================
        // SAVE CURRENT USER
        // ==================================================

        let currentUser = {

            id: user.id,

            name: user.name,

            email: user.email,

            role: user.role || "User"

        };


        localStorage.setItem(
            "currentUser",
            JSON.stringify(currentUser)
        );



        // ==================================================
        // LOGIN SUCCESS
        // ==================================================

        alert(
            "Welcome, " +
            currentUser.name +
            "!"
        );



        // ==================================================
        // GO TO CHOOSE ROLE
        // ==================================================

        window.location.href =
            "choose_role.html";

    }



    // ==================================================
    // SHOW / HIDE PASSWORD
    // ==================================================

    function showPassword() {


        const password =
            document.getElementById(
                "password"
            );


        const eyeIcon =
            document.getElementById(
                "eyeIcon"
            );


        if (
            password.type === "password"
        ) {


            // Show password

            password.type = "text";


            eyeIcon.classList.remove(
                "bi-eye"
            );


            eyeIcon.classList.add(
                "bi-eye-slash"
            );

        }

        else {


            // Hide password

            password.type =
                "password";


            eyeIcon.classList.remove(
                "bi-eye-slash"
            );


            eyeIcon.classList.add(
                "bi-eye"
            );

        }

    }



    // ==================================================
    // FORGOT PASSWORD
    // ==================================================

    function forgotPassword(event) {

        event.preventDefault();

        alert(
            "Forgot password feature is Front-End only."
        );

    }



    // ==================================================
    // CREATE DEFAULT ADMIN
    // ==================================================

    createDefaultAdmin();


</script>
</body>
</html>
