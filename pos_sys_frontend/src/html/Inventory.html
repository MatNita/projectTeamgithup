<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Management</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Kanten', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f4f6f9;
            margin: 20px;
            color: #333;
        }
        .container {
            display: flex;
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .form-container, .table-container {
            background: #ffffff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .form-container {
            flex: 1;
        }
        .table-container {
            flex: 2;
        }
        h2 {
            margin-top: 0;
            color: #2c3e50;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .image-preview {
            width: 100%;
            height: 150px;
            border: 2px dashed #ccc;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 10px;
            overflow: hidden;
        }
        .image-preview img {
            max-width: 100%;
            max-height: 100%;
            object-fit: cover;
        }
        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        button {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 4px;
            color: #fff;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        .btn-save { background-color: #27ae60; }
        .btn-save:hover { background-color: #219150; }
        .btn-update { background-color: #2980b9; }
        .btn-update:hover { background-color: #1f6391; }
        .btn-delete { background-color: #c0392b; }
        .btn-delete:hover { background-color: #962d22; }
        .btn-clear { background-color: #7f8c8d; }
        .btn-clear:hover { background-color: #616e6f; }

        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: left;
        }
        th {
            background-color: #34495e;
            color: white;
        }
        tr:hover {
            background-color: #f1f1f1;
            cursor: pointer;
        }
        tr.selected {
            background-color: #d1ecf1;
        }
        .product-img-tbl {
            width: 50px;
            height: 50px;
            object-fit: cover;
            border-radius: 4px;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Form Section -->
    <div class="form-container">
        <h2>Information of Product</h2>
        <form id="productForm" onsubmit="event.preventDefault();">
            <input type="hidden" id="productId">

            <div class="form-group">
                <label for="productName">Product-Name</label>
                <input type="text" id="productName" required>
            </div>

            <!-- កែប្រែ Category ទៅជា Dropdown Select -->
            <div class="form-group">
                <label for="category">category</label>
                <select id="category" required>
                    <option value="">Select category</option>
                    <option value="Maincourse">Maincourse</option>
                    <option value="Desert">Desert</option>
                    <option value="Drink">Drink</option>
                    <option value="Salats">Salats</option>
                    <option value="Soup">Soup</option>
                </select>
            </div>

            <div class="form-group">
                <label for="stock">Stock</label>
                <input type="number" id="stock" required>
            </div>

            <div class="form-group">
                <label for="price">Price $</label>
                <input type="number" step="0.01" id="price" required>
            </div>

            <div class="form-group">
                <label for="status">Status</label>
                <select id="status" required>
                    <option value="">Select Status</option>
                    <option value="Active">Active</option>
                    <option value="Inactive">Inactive</option>
                </select>
            </div>

            <div class="form-group">
                <label for="imageInput">Image</label>
                <input type="file" id="imageInput" accept="image/*">
                <div class="image-preview" id="previewContainer">
                    <img id="imagePreview" src="" alt="រូបភាពបង្ហាញ" style="display:none;">
                </div>
            </div>

            <div class="btn-group">
                <button type="button" class="btn-save" onclick="saveProduct()">Add</button>
                <button type="button" class="btn-update" onclick="updateProduct()">Update</button>
                <button type="button" class="btn-delete" onclick="deleteProduct()">Delete</button>
                <button type="button" class="btn-clear" onclick="clearForm()">Clear</button>
            </div>
        </form>
    </div>

    <!-- Table Section -->
    <div class="table-container">
        <h2>Product List</h2>
        <table>
            <thead>
                <tr>
                    <th>Image</th>
                    <th>Name</th>
                    <th>Category</th>
                    <th>Stock</th>
                    <th>Price</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody id="productTableBody">
                <!-- Data will be loaded here dynamically -->
            </tbody>
        </table>
    </div>
</div>

<script>
    const API_URL = "http://127.0.0.1:8000/api/products";
    let products = [];
    let selectedIndex = -1;
    let selectedImage = "";

    // Load initial products from API
    document.addEventListener("DOMContentLoaded", fetchProducts);

    async function fetchProducts() {
        try {
            const response = await fetch(API_URL);
            if (!response.ok) throw new Error("Network response was not ok");
            products = await response.json();
            displayProducts();
        } catch (error) {
            console.error("Error fetching products:", error);
        }
    }

    function displayProducts() {
        const tbody = document.getElementById("productTableBody");
        tbody.innerHTML = "";

        products.forEach((product, index) => {
            const tr = document.createElement("tr");
            if (index === selectedIndex) tr.classList.add("selected");

            tr.onclick = () => selectProduct(index);

            tr.innerHTML = `
                <td><img src="http://127.0.0.1:8000/${product.image}" class="product-img-tbl" alt="prod"></td>
                <td>${product.name || ''}</td>
                <td>${product.category || ''}</td>
                <td>${product.stock ?? 0}</td>
                <td>$${parseFloat(product.price || 0).toFixed(2)}</td>
                <td>${product.status || ''}</td>
            `;
            tbody.appendChild(tr);
        });
    }

    // Image file handler
    document.getElementById("imageInput").addEventListener("change", function(e) {
        const file = e.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(event) {
                selectedImage = event.target.result;
                const img = document.getElementById("imagePreview");
                img.src = selectedImage;
                img.style.display = "block";
            };
            reader.readAsDataURL(file);
        }
    });

    function selectProduct(index) {
        selectedIndex = index;
        const p = products[index];

        document.getElementById("productId").value = p.id || "";
        document.getElementById("productName").value = p.name || "";
        document.getElementById("category").value = p.category || "";
        document.getElementById("stock").value = p.stock ?? "";
        document.getElementById("price").value = p.price ?? "";
        document.getElementById("status").value = p.status || "";

        const img = document.getElementById("imagePreview");
        if (p.image) {
            selectedImage = p.image;
            img.src = p.image;
            img.style.display = "block";
        } else {
            selectedImage = "";
            img.src = "";
            img.style.display = "none";
        }

        displayProducts();
    }

async function saveProduct() {

    const name = document.getElementById("productName").value.trim();
    const category = document.getElementById("category").value;
    const stock = document.getElementById("stock").value;
    const price = document.getElementById("price").value;
    const status = document.getElementById("status").value;
    const imageFile = document.getElementById("imageInput").files[0];

    if (!name) {
        alert("សូមបញ្ចូលឈ្មោះផលិតផល!");
        return;
    }

    if (!category) {
        alert("សូមជ្រើសរើសប្រភេទ Category!");
        return;
    }

    const formData = new FormData();

    formData.append("name", name);
    formData.append("category", category);
    formData.append("stock", stock || 0);
    formData.append("price", price || 0);
    formData.append("status", status);

    if (imageFile) {
        formData.append("image", imageFile);
    }

    console.log("================================");
    console.log("API URL:", API_URL);
    console.log("Method: POST");
    console.log("Image:", imageFile);
    console.log("================================");

    try {

        const response = await fetch(API_URL, {
            method: "POST",

            headers: {
                "Accept": "application/json"
            },

            body: formData
        });

        console.log("Response received!");
        console.log("Status:", response.status);
        console.log("OK:", response.ok);

        const text = await response.text();

        console.log("Server response:", text);

        let result;

        try {
            result = JSON.parse(text);
        } catch (e) {
            result = { message: text };
        }

        if (response.ok) {

            alert("រក្សាទុកជោគជ័យ!");

            console.log("Product created:", result);

            clearForm();
            fetchProducts();

        } else {

            console.error("Laravel Error:", result);

            let message = "មានបញ្ហាក្នុងការរក្សាទុក!\n";

            if (result.errors) {

                for (const field in result.errors) {
                    message +=
                        `- ${result.errors[field].join(", ")}\n`;
                }

            } else {

                message += result.message || "Unknown error";
            }

            alert(message);
        }

    } catch (error) {

        console.error("================================");
        console.error("FETCH ERROR");
        console.error(error);
        console.error("================================");

        alert(
            "មិនអាចភ្ជាប់ទៅកាន់ Server បានទេ!\n\n" +
            error.message
        );
    }
}
    async function updateProduct() {
        const id = document.getElementById("productId").value;
        if (!id) return alert("Please select a product to edit!");

        const payload = getFormData();

        try {
            const response = await fetch("http://127.0.0.1:8000/api/products", {
                method: "PUT",
                headers: { 
                    "Content-Type": "application/json", 
                    "Accept": "application/json" 
                },
                body: JSON.stringify(payload)
            });

            if (response.ok) {
                alert("កែប្រែជោគជ័យ!");
                clearForm();
                fetchProducts();
            } else {
                alert("មានបញ្ហាក្នុងការកែប្រែ!");
            }
        } catch (error) {
            console.error("Error updating product:", error);
        }
    }

    async function deleteProduct() {
        const id = document.getElementById("productId").value;
        if (!id) return alert("សូមជ្រើសរើសផលិតផលដើម្បីលុប!");

        if (!confirm("តើអ្នកប្រាកដថាចង់លុបផលិតផលនេះមែនទេ?")) return;

        try {
            const response = await fetch(`${API_URL}/${id}`, {
                method: "DELETE",
                headers: { "Accept": "application/json" }
            });

            if (response.ok) {
                alert("លុបជោគជ័យ!");
                clearForm();
                fetchProducts();
            } else {
                alert("មានបញ្ហាក្នុងការលុប!");
            }
        } catch (error) {
            console.error("Error deleting product:", error);
        }
    }

    function getFormData() {
        return {
            name: document.getElementById("productName").value,
            category: document.getElementById("category").value,
            stock: parseInt(document.getElementById("stock").value) || 0,
            price: parseFloat(document.getElementById("price").value) || 0,
            status: document.getElementById("status").value,
            image: selectedImage
        };
    }

    function clearForm() {
        document.getElementById("productId").value = "";
        document.getElementById("productName").value = "";
        document.getElementById("category").value = "";
        document.getElementById("stock").value = "";
        document.getElementById("price").value = "";
        document.getElementById("status").value = "";
        document.getElementById("imageInput").value = "";

        const img = document.getElementById("imagePreview");
        img.src = "";
        img.style.display = "none";

        selectedImage = "";
        selectedIndex = -1;

        displayProducts();
    }
</script>

</body>
</html>
