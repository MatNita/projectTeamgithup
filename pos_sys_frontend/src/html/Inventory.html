<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Restaurant Management System - Inventory</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #eeeeee;
        }

        /* Main container */
        .container {
            width: 100%;
            min-height: 100vh;
            padding: 30px;
        }

        /* Product table box */
        .table-box {
            background: white;
            padding: 20px;
            border-radius: 4px;
            margin-bottom: 25px;
        }

        .table-title {
            font-size: 15px;
            margin-bottom: 8px;
            color: #333;
        }

        .table-container {
            width: 100%;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        th {
            background: #4b3029;
            color: white;
            padding: 7px;
            border: 1px solid #ddd;
            text-align: left;
        }

        td {
            padding: 7px;
            border: 1px solid #ddd;
            background: #f5f5f5;
        }

        tbody tr {
            cursor: pointer;
        }

        tbody tr:hover td {
            background: #e9dfdc;
        }

        tbody tr.selected td {
            background: #1479c9;
            color: white;
        }

        /* Form */
        .form-box {
            background: white;
            padding: 30px 40px;
            min-height: 300px;
        }

        .form-content {
            display: flex;
            justify-content: space-between;
            gap: 40px;
        }

        .form-left {
            flex: 1;
        }

        .form-row {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
        }

        .form-row label {
            width: 105px;
            text-align: right;
            margin-right: 12px;
            font-size: 14px;
            color: #333;
        }

        input,
        select {
            width: 210px;
            height: 28px;
            border: 1px solid #bbb;
            padding: 5px 8px;
            outline: none;
            background: white;
        }

        input:focus,
        select:focus {
            border-color: #6b463c;
        }

        /* Image section */
        .image-section {
            width: 150px;
            text-align: center;
        }

        #imagePreview {
            width: 130px;
            height: 140px;
            object-fit: cover;
            border: 1px solid #ddd;
            background: #f3f3f3;
            display: block;
            margin-bottom: 8px;
        }

        .import-btn {
            width: 130px;
            height: 34px;
            border: none;
            background: #5a3b33;
            color: white;
            cursor: pointer;
            font-weight: bold;
        }

        .import-btn:hover {
            background: #432b25;
        }

        #imageInput {
            display: none;
        }

        /* Buttons */
        .buttons {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-top: 25px;
        }

        .buttons button {
            width: 130px;
            height: 35px;
            border: none;
            background: #5a3b33;
            color: white;
            cursor: pointer;
            font-weight: bold;
        }

        .buttons button:hover {
            background: #432b25;
        }

        /* Status */
        .available {
            color: green;
            font-weight: bold;
        }

        .unavailable {
            color: red;
            font-weight: bold;
        }

        /* Responsive */
        @media (max-width: 900px) {
            .form-content {
                flex-direction: column;
            }

            .form-left {
                width: 100%;
            }

            .image-section {
                margin: auto;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="table-box">
        <div class="table-title"> All Products</div>
        <div class="table-container">
            <table id="productTable">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>ProductId</th>
                        <th>ProductName</th>
                        <th>Category</th>
                        <th>stock</th>
                        <th>price</th>
                        <th>status</th>
                        <th>image</th>
                        <th>DateInsert</th>
                        <th>DateUpdate</th>
                    </tr>
                </thead>
                <tbody id="productTableBody">
                </tbody>
            </table>
        </div>
    </div>

    <div class="form-box">
        <div class="form-content">
            <div class="form-left">
                <div class="form-row">
                    <label>Product ID:</label>
                    <input type="text" id="productId">
                </div>
                <div class="form-row">
                    <label>Product Name:</label>
                    <input type="text" id="productName">
                </div>
                <div class="form-row">
                    <label>Category:</label>
                    <select id="category">
                        <option value="">Select Category</option>
                        <option value="Main Course">Main Course</option>
                        <option value="CSoup">Soup</option>
                        <option value="Salads">Salads</option>
                        <option value="Dessert">Dessert</option>
                        <option value="Drink">Drink</option>
                        <option value="Cake">Cake</option>
                    </select>
                </div>
            </div>
            <div class="form-left">
                <div class="form-row">
                    <label>Stock:</label>
                    <input type="number" id="stock">
                </div>

                <div class="form-row">
                    <label>Price ($):</label>
                    <input type="number" id="price" step="0.01">
                </div>

                <div class="form-row">
                    <label>Status:</label>
                    <select id="status">
                        <option value="">Select Status</option>
                        <option value="Available">Available</option>
                        <option value="Unavailable">Unavailable</option>
                    </select>
                </div>
            </div>
            <!-- image -->
            <div class="image-section">
                <img id="imagePreview" src="" alt="Product Image">
                <input type="file" id="imageInput" accept="image/*">
                <button class="import-btn" onclick="document.getElementById('imageInput').click()">IMPORT</button>
            </div>
        </div>
        <!-- Button -->
        <div class="buttons">
            <button onclick="addProduct()">ADD</button>
            <button onclick="updateProduct()">UPDATE</button>
            <button onclick="deleteProduct()">DELETE</button>
            <button onclick="clearForm()">CLEAR</button>
        </div>
    </div>
</div>
<script>

    let products = JSON.parse(localStorage.getItem("products")) || [];

    let selectedIndex = -1;
    let selectedImage = "";
    function displayProducts() {
        const tableBody =
            document.getElementById("productTableBody");
        tableBody.innerHTML = "";
        products.forEach((product, index) => {
            const row = document.createElement("tr");
            if (index === selectedIndex) {
                row.classList.add("selected");
            }
            row.innerHTML = `
                <td>${product.id}</td>
                <td>${product.productId}</td>
                <td>${product.productName}</td>
                <td>${product.category}</td>
                <td>${product.stock}</td>
                <td>${product.price}</td>
                <td class="${product.status === "Available"? "available": "unavailable"}">${product.status}
                </td>
                <td>
                    ${product.image? "Image": ""}
                </td>
                <td>${product.dateInsert}</td>
                <td>${product.dateUpdate}</td>
            `;
            row.onclick = function () {
                selectProduct(index);
            };
            tableBody.appendChild(row);
        });
    }
    // Select Product
    function selectProduct(index) {
        selectedIndex = index;
        const product = products[index];
        document.getElementById("productId").value =
            product.productId;
        document.getElementById("productName").value =
            product.productName;
        document.getElementById("category").value =
            product.category;
        document.getElementById("stock").value =
            product.stock;
        document.getElementById("price").value =
            product.price;
        document.getElementById("status").value =
            product.status;
        selectedImage = product.image || "";
        document.getElementById("imagePreview").src =
            selectedImage;
       displayProducts();
    }
    // Import Image
    document
        .getElementById("imageInput")
        .addEventListener("change", function(event) {
            const file = event.target.files[0];
            if (!file) {
                return;
            }
            // Check image
            if (!file.type.startsWith("image/")) {
                alert("Please select an image file.");
                return;
            }
            const reader = new FileReader();
            reader.onload = function(e) {
                selectedImage = e.target.result;
                document.getElementById("imagePreview").src =
                    selectedImage;
            };
            reader.readAsDataURL(file);
        });
    function addProduct() {
        const productId =
            document.getElementById("productId").value.trim();
        const productName =
            document.getElementById("productName").value.trim();
        const category =
            document.getElementById("category").value;
        const stock =
            document.getElementById("stock").value;
        const price =
            document.getElementById("price").value;
        const status =
            document.getElementById("status").value;
        // Validation
        if (
            productId === "" ||
            productName === "" ||
            category === "" ||
            stock === "" ||
            price === "" ||
            status === ""
        ) {
            alert("Please fill in all fields.");
            return;
        }
        const newId =
            products.length > 0
            ? Math.max(...products.map(p => p.id)) + 1
            : 1;
        const today =
            new Date().toLocaleDateString("en-US");
        const newProduct = {
            id: newId,
            productId: productId,
            productName: productName,
            category: category,
            stock: Number(stock),
            price: Number(price),
            status: status,
            image: selectedImage,
            dateInsert: today,
            dateUpdate: ""
        };
        products.push(newProduct);
        localStorage.setItem("products", JSON.stringify(products));
        displayProducts();
        clearForm();
        alert("Product added successfully!");
    }
    function updateProduct() {
        if (selectedIndex === -1) {
            alert("Please select a product first.");
            return;
        }
        const product =
            products[selectedIndex];
        product.productId =
            document.getElementById("productId").value.trim();
        product.productName =
            document.getElementById("productName").value.trim();
        product.category =
            document.getElementById("category").value;
        product.stock =
            Number(document.getElementById("stock").value);
        product.price =
            Number(document.getElementById("price").value);
        product.status =
            document.getElementById("status").value;
        product.image =
            selectedImage;
        product.dateUpdate =
            new Date().toLocaleDateString("en-US");
            // Save updated products
            localStorage.setItem("products", JSON.stringify(products));
        displayProducts();
       alert("Product updated successfully!");
    }
    function deleteProduct() {
        if (selectedIndex === -1) {
            alert("Please select a product first.");
            return;
        }
        const confirmDelete =
            confirm(
                "Are you sure you want to delete this product?"
            );
        if (!confirmDelete) {
           return;
        }
        products.splice(selectedIndex, 1);
        localStorage.setItem("products", JSON.stringify(products));
        selectedIndex = -1;
        displayProducts();
        clearForm();
        alert("Product deleted successfully!");
    }
    function clearForm() {
        document.getElementById("productId").value = "";
        document.getElementById("productName").value = "";
        document.getElementById("category").value = "";
        document.getElementById("stock").value = "";
        document.getElementById("price").value = "";
        document.getElementById("status").value = "";
        document.getElementById("imageInput").value = "";
        document.getElementById("imagePreview").src = "";
        selectedImage = "";
        selectedIndex = -1;
        displayProducts();
    }
    displayProducts();

</script>

</body>
</html>
